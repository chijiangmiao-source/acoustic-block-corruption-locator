services:
  api:
    build: .
    image: aclog-inspector
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  verify:
    build: .
    image: aclog-inspector
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command: ["python", "-m", "pytest", "verify/", "-v", "--tb=short"]
